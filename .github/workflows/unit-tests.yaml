name: Tests

on: [push, pull_request]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        php: [8.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath, json
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "php-${{ matrix.php }}-${{ matrix.os }}-${{ hashFiles('composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-${{ matrix.os }}-${{ hashFiles('composer.json') }}"

      - name: Install Composer
        run: composer install --dev --prefer-dist --no-progress --no-interaction

  kronika:
    needs: build
    runs-on: ${{ needs.build.os }}-latest
    steps:
      - name: Run "Kronika\Utils" Unit Tests
        run: php -d memory_limit=-1 -d zend.assertions=1 vendor/bin/phpunit --testsuite 'Kronika\Utils'

      - name: Run "Kronika" Unit Tests
        run: php -d memory_limit=-1 -d zend.assertions=1 vendor/bin/phpunit --testsuite 'Kronika'

  extensions:
    needs: [build, kronika]
    runs-on: ${{ needs.build.os }}-latest
    steps:
      - name: Run "Kronika\Extension" Unit Tests
        run: php -d memory_limit=-1 -d zend.assertions=1 vendor/bin/phpunit --testsuite 'Kronika\Extension'
