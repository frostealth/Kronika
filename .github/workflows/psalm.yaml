name: Psalm

on: [push, pull_request]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  psalm:
    name: psalm (php${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath, json
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "php-${{ matrix.php }}-ubuntu-${{ hashFiles('composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-ubuntu-${{ hashFiles('composer.json') }}"

      - name: Install Composer
        run: composer install --dev --prefer-dist --no-progress --no-interaction

      - name: Run Psalm
        run: php -d memory_limit=-1 -d zend.assertions=1 vendor/bin/psalm --output-format=github --no-progress
