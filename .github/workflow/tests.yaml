name: Tests

on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        php: ['8.4']
        test-suit: ['Kronika\Utils', 'Kronika', 'Kronika\Extension']
        include:
          php: '8.5'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer@v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          key: "php-${{ matrix.php }}-${{ matrix.os }}-${{ hashFiles('composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-${{ matrix.os }}-${{ hashFiles('composer.json') }}"

      - name: Install Composer
        run: composer install --dev --prefer-dist --no-progress

      - name: Run ${{ matrix.test-suit }} Tests
        uses: php-actions/phpunit@v4
        with:
          php_version: ${{ matrix.php }}
          configuration: 'psalm.xml'
          testsuit: ${{ matrix.test-suit }}
